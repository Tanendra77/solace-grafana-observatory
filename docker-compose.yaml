# =============================================================================
# Solace Distributed Tracing Observatory
#   otel-collector -> elasticsearch -> kibana
#
# Talks to a broker started separately (docker-compose.broker.yaml, or your own).
# Run ./scripts/setup-broker-tracing.sh once against it before `up` — see README.
# =============================================================================

name: solace-dt-observatory

networks:
  solace_dt_net:
    name: solace_dt_net
    driver: bridge

volumes:
  es-data:            # trace documents, single-node
  # Kibana keeps its saved objects (index patterns, dashboards) inside
  # Elasticsearch itself, not on disk, so it needs no volume of its own.

services:
  # OTel Collector — the Solace -> OTLP bridge.
  otel-collector:
    image: ${OTELCOL_IMAGE}
    container_name: dtobs-otelcol
    hostname: otel-collector
    networks: [solace_dt_net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${COLLECTOR_UID}:${COLLECTOR_GID}"
    command: ["--config=/etc/otel/collector.yaml"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - SOLACE_BROKER_HOST=${SOLACE_BROKER_HOST}
      - SOLACE_BROKER_AMQP_PORT=${SOLACE_BROKER_AMQP_PORT}
      - SOLACE_BROKER_AMQP_PORT_2=${SOLACE_BROKER_AMQP_PORT_2}
      # The VPN names are the values of the solace.msg_vpn attribute the
      # collector stamps on each stream, not just bootstrap-script inputs.
      - SOLACE_MSG_VPN=${SOLACE_MSG_VPN}
      - SOLACE_MSG_VPN_2=${SOLACE_MSG_VPN_2}
      - SOLACE_TRACE_USER=${SOLACE_TRACE_USER}
      - SOLACE_TRACE_PASSWORD=${SOLACE_TRACE_PASSWORD}
      - SOLACE_TELEMETRY_QUEUE=${SOLACE_TELEMETRY_QUEUE}
      - SOLACE_MAX_UNACKNOWLEDGED=${SOLACE_MAX_UNACKNOWLEDGED}
      - OTEL_MEMORY_LIMIT_MIB=${OTEL_MEMORY_LIMIT_MIB}
      - OTEL_MEMORY_SPIKE_MIB=${OTEL_MEMORY_SPIKE_MIB}
      - OTEL_BATCH_SIZE=${OTEL_BATCH_SIZE}
      - OTEL_BATCH_TIMEOUT=${OTEL_BATCH_TIMEOUT}
      - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL}
      - OTEL_DEBUG_VERBOSITY=${OTEL_DEBUG_VERBOSITY}
      - TRACE_FILE_MAX_MB=${TRACE_FILE_MAX_MB}
      - TRACE_FILE_MAX_DAYS=${TRACE_FILE_MAX_DAYS}
      - TRACE_FILE_MAX_BACKUPS=${TRACE_FILE_MAX_BACKUPS}
    ports:
      - "${PORT_OTLP_GRPC}:4317"        # OTLP in — seam for instrumented apps
      - "${PORT_OTLP_HTTP}:4318"        # OTLP in — seam for instrumented apps
      - "${PORT_OTEL_HEALTH}:13133"     # health check
      - "${PORT_OTEL_METRICS}:8888"     # collector's own metrics
      - "${PORT_OTEL_ZPAGES}:55679"     # zpages
    volumes:
      - ./config/otel:/etc/otel:ro
      - ./trace-data:/trace-data
    restart: unless-stopped

  # Elasticsearch — trace store. Single node, security off: this mirrors the
  # rest of the branch (plain HTTP broker, no-TLS Grafana equivalent) rather
  # than standing up certs and a bootstrap password for a local-dev stack.
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    container_name: dtobs-elasticsearch
    hostname: elasticsearch
    networks: [solace_dt_net]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms${ES_HEAP_MB}m -Xmx${ES_HEAP_MB}m"
    ports:
      - "${PORT_ELASTICSEARCH}:9200"     # query API — Kibana and verify.sh
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      # First boot allocates the JVM heap and initializes the data dir
      start_period: 90s
    restart: unless-stopped

  # Kibana — trace explorer (Discover / APM) over the elasticsearch datasource,
  # which is implicit: Kibana always talks to the one Elasticsearch it's
  # pointed at, there is no separate datasource object to provision.
  kibana:
    image: ${KIBANA_IMAGE}
    container_name: dtobs-kibana
    hostname: kibana
    networks: [solace_dt_net]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${PORT_KIBANA}:5601"
    restart: unless-stopped
