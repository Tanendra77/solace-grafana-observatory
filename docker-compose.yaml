# =============================================================================
# Solace Broker Metrics — local stack
#
#   solbroker -> solace-exporter -> prometheus -> grafana
#
# All configuration lives in .env. Prefer ./stack.sh over raw compose: it
# derives COMPOSE_PROFILES from BROKER_MODE.
# =============================================================================

name: solace-metrics-observatory

networks:
  solace_metrics_net:
    name: solace_metrics_net
    driver: bridge

volumes:
  solace-storage:      # broker config + message spool — survives down/up
  prometheus-data:     # TSDB blocks — 7d/2GB retention
  grafana-data:        # Grafana SQLite: users, dashboards, datasource state

services:

  # ---------------------------------------------------------------------------
  # Solace PubSub+ broker.
  #
  # Only started when BROKER_MODE=local (profile: local-broker). In external
  # mode this service is never created and the rest of the stack talks to
  # whatever SOLACE_BROKER_HOST points at.
  #
  # The `monitor` SEMP user is created here, not in broker-setup.sh: it is a
  # broker-level identity (like `admin`), not a Message-VPN-scoped client
  # username. The Solace docker image treats any `username_<name>_<attr>` env
  # var as a CLI config command run at first boot — confirmed working against
  # this exact image/exporter pairing during planning.
  # ---------------------------------------------------------------------------
  solbroker:
    image: ${SOLACE_IMAGE}
    container_name: mobs-solbroker
    hostname: solbroker
    profiles: ["local-broker"]
    networks: [solace_metrics_net]
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${SOLACE_ADMIN_PASSWORD}
      - username_monitor_globalaccesslevel=read-only
      - username_monitor_password=${SOLACE_MONITOR_PASSWORD}
      - system_scaling_maxconnectioncount=100
      - webmanager_redirecthttp_enable=false
    ports:
      - "${PORT_BROKER_SEMP}:8080"      # web UI + SEMP API
      - "${PORT_BROKER_SMF}:55555"      # SMF — sdkperf connects here
      - "${PORT_BROKER_HEALTH}:5550"    # health check
      - "${PORT_BROKER_SSH}:2222"       # broker CLI over SSH
      - "${PORT_BROKER_WEB}:8008"       # web messaging
    volumes:
      - solace-storage:/var/lib/solace
    shm_size: 2g
    ulimits:
      memlock: -1
      nofile:
        soft: 2448
        hard: 1048576
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5550/health-check/guaranteed-active"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 150s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot broker configuration over SEMP v2: VPN, app-user ACL/client
  # profiles, and a demo queue + topic subscription. No AMQP here — metrics
  # flow entirely over SEMP, unlike the tracing branch.
  #
  # No depends_on: in external mode solbroker does not exist, so the script
  # polls SEMP itself until the broker answers.
  # ---------------------------------------------------------------------------
  broker-bootstrap:
    image: ${CURL_IMAGE}
    container_name: mobs-bootstrap
    networks: [solace_metrics_net]
    entrypoint: ["/bin/sh", "/scripts/broker-setup.sh"]
    environment:
      - BOOTSTRAP_ENABLED=${BOOTSTRAP_ENABLED}
      - SOLACE_SEMP_URL=${SOLACE_SEMP_URL}
      - SOLACE_ADMIN_USER=${SOLACE_ADMIN_USER}
      - SOLACE_ADMIN_PASSWORD=${SOLACE_ADMIN_PASSWORD}
      - SOLACE_MSG_VPN=${SOLACE_MSG_VPN}
      - SOLACE_VPN_SPOOL_MB=${SOLACE_VPN_SPOOL_MB}
      - SOLACE_APP_USER=${SOLACE_APP_USER}
      - SOLACE_APP_PASSWORD=${SOLACE_APP_PASSWORD}
      - SOLACE_DEMO_QUEUE=${SOLACE_DEMO_QUEUE}
      - SOLACE_DEMO_TOPIC=${SOLACE_DEMO_TOPIC}
      - SOLACE_DEMO_QUEUE_SPOOL_MB=${SOLACE_DEMO_QUEUE_SPOOL_MB}
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

  # ---------------------------------------------------------------------------
  # Prometheus exporter (solacecommunity/solace-prometheus-exporter).
  #
  # Scrapes the broker's SEMP API with the read-only `monitor` user and
  # re-exposes it in Prometheus format. Endpoint aliases /solace-std,
  # /solace-vpn-stats and /solace-det work out of the box from these three env
  # vars alone — no config file needed. Confirmed against this exact image
  # during planning: 80+ solace_* series on /solace-std, queue-level detail
  # (solace_queue_spool_usage_msgs etc, labelled queue_name/vpn_name) on
  # /solace-det.
  #
  # Gates on broker-bootstrap completing, not merely solbroker starting: the
  # VPN and demo queue must exist before the first scrape for that data to
  # show up immediately.
  # ---------------------------------------------------------------------------
  solace-exporter:
    image: ${EXPORTER_IMAGE}
    container_name: mobs-exporter
    hostname: solace-exporter
    networks: [solace_metrics_net]
    depends_on:
      broker-bootstrap:
        condition: service_completed_successfully
    environment:
      - SOLACE_SCRAPE_URI=${SOLACE_SEMP_URL}
      - SOLACE_USERNAME=monitor
      - SOLACE_PASSWORD=${SOLACE_MONITOR_PASSWORD}
    ports:
      - "${PORT_EXPORTER}:9628"
    restart: unless-stopped
