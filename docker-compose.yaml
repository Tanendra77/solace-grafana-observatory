# Solace Broker Metrics — Prometheus + Grafana
#   solace-exporter -> prometheus -> grafana
# Talks to a broker started separately (docker-compose.broker.yaml, or your own)
# TLS: every hop here (exporter's own listener, Prometheus, Grafana) serves
# HTTPS using certs/server.crt + certs/server.key — run
# ./scripts/generate-certs.sh once before first `up`. Self-signed, so
# SOLACE_SSL_VERIFY and each datasource's tlsSkipVerify are set accordingly;
# swap in a CA-signed cert for anything beyond local dev.

name: solace-metrics-observatory

networks:
  solace_metrics_net:
    name: solace_metrics_net
    driver: bridge

volumes:
  prometheus-data:     # TSDB blocks — 7d/2GB retention
  grafana-data:        # Grafana SQLite: users, dashboards, datasource state

services:

  # Scrapes the broker's SEMP API, exposes it in Prometheus format.
  solace-exporter:
    image: ${EXPORTER_IMAGE}
    container_name: mobs-exporter
    hostname: solace-exporter
    networks: [solace_metrics_net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SOLACE_SCRAPE_URI=${SOLACE_SEMP_URL}
      - SOLACE_USERNAME=monitor
      - SOLACE_PASSWORD=${SOLACE_MONITOR_PASSWORD}
      - SOLACE_SSL_VERIFY=false
      - SOLACE_LISTEN_TLS=true
      - SOLACE_SERVER_CERT=/certs/server.crt
      - SOLACE_PRIVATE_KEY=/certs/server.key
    ports:
      - "${PORT_EXPORTER}:9628"
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped

  # Local TSDB, retention bounded by time and size.
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: mobs-prometheus
    hostname: prometheus
    networks: [solace_metrics_net]
    depends_on:
      solace-exporter:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.config.file=/etc/prometheus/web-config.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${METRICS_RETENTION_TIME}"
      - "--storage.tsdb.retention.size=${METRICS_RETENTION_SIZE}"
    ports:
      - "${PORT_PROMETHEUS}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/web-config.yml:/etc/prometheus/web-config.yml:ro
      - ./certs:/certs:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Datasource and dashboard provisioned from files under config/grafana/.
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: mobs-grafana
    hostname: grafana
    networks: [solace_metrics_net]
    depends_on:
      prometheus:
        condition: service_started
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_LEVEL=info
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/solace-home.json
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/certs/server.crt
      - GF_SERVER_CERT_KEY=/certs/server.key
    ports:
      - "${PORT_GRAFANA}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./certs:/certs:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
