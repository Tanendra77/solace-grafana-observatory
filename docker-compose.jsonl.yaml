# =============================================================================
# Overlay enabling the JSONL trace sink. Layer it in when
# TRACE_FILE_ENABLED=true:
#
#   docker compose -f docker-compose.yaml -f docker-compose.jsonl.yaml up -d
#
# Spans then land in ./trace-data/traces.jsonl in addition to Tempo.
# =============================================================================

services:
  otel-collector:
    command:
      - "--config=/etc/otel/collector.yaml"
      - "--config=/etc/otel/jsonl-overlay.yaml"
