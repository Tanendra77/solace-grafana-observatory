# Scrape config: 3 jobs, one per exporter endpoint. Job name doubles as the
# `job` label (some metrics appear under more than one endpoint).
#
# scheme/tls_config apply to every job below — the exporter serves HTTPS
# with the same self-signed cert as the rest of the stack (see
# ../../certs/, generated by ../../scripts/generate-certs.sh). Prometheus's
# own HTTPS listener (Grafana -> Prometheus) is configured separately via
# --web.config.file, not here.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # System, redundancy, config-sync, VPN config-level metrics. Cheap to poll.
  - job_name: solace-std
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /solace-std
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["solace-exporter:9628"]

  # VPN traffic, per-client throughput, queue message-rate counters.
  - job_name: solace-vpn-stats
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /solace-vpn-stats
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["solace-exporter:9628"]

  # Queue depth/binds/subscriptions detail. Kept slower than the other two:
  # this endpoint enumerates every queue on the VPN, so on a broker with
  # hundreds/thousands of queues it is meaningfully heavier on SEMP than
  # solace-std or solace-vpn-stats. 15s here (down from the original 60s) —
  # if this is pointed at a broker with 1000+ queues and SEMP load becomes
  # a concern, raise it back up rather than pushing it to 10s too.
  - job_name: solace-det
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /solace-det
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["solace-exporter:9628"]

  # Prometheus's own health, for completeness. Itself HTTPS now too.
  - job_name: prometheus
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["localhost:9090"]
