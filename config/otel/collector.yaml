# =============================================================================
# OTel Collector — Solace telemetry queue -> Elasticsearch
#
# Requires the contrib distribution; the `solace` receiver exists nowhere else.
# Every value comes from the environment, set in .env.
# =============================================================================

receivers:
  # One receiver per Message VPN: a telemetry profile is per-VPN, so each VPN
  # spools to its own queue, and a receiver binds exactly one. `broker` takes
  # exactly one entry — it is a list for future HA, not fan-out. The port is
  # what selects the VPN, which is why VPN 2 needs its own.

  # broker1 vpn1
  solace/vpn1:
    broker: ["${env:SOLACE_BROKER_HOST}:${env:SOLACE_BROKER_AMQP_PORT}"]
    auth:
      sasl_plain:
        username: ${env:SOLACE_TRACE_USER}
        password: ${env:SOLACE_TRACE_PASSWORD}
    queue: ${env:SOLACE_TELEMETRY_QUEUE}
    max_unacknowledged: ${env:SOLACE_MAX_UNACKNOWLEDGED}
    tls:
      insecure: true
      insecure_skip_verify: true

  # broker1 vpn 2
  solace/vpn2:
    broker: ["${env:SOLACE_BROKER_HOST}:${env:SOLACE_BROKER_AMQP_PORT_2}"]
    auth:
      sasl_plain:
        username: ${env:SOLACE_TRACE_USER}
        password: ${env:SOLACE_TRACE_PASSWORD}
    queue: ${env:SOLACE_TELEMETRY_QUEUE}
    max_unacknowledged: ${env:SOLACE_MAX_UNACKNOWLEDGED}
    tls:
      insecure: true
      insecure_skip_verify: true

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter MUST be first — it can only shed load it sees before
  # anything else buffers it.
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_MEMORY_SPIKE_MIB}

  # Both VPNs share one index, so spans need to say which VPN they came from.
  # The receiver already knows — it puts the VPN name in service.instance.id — so copy it to a field that reads as what it is.
  # Taking the value from the span rather than from config is what lets every VPN share one pipeline.
  # transform/vpn-tag:
  #   error_mode: ignore
  #   trace_statements:
  #     - context: resource
  #       statements:
  #         - set(resource.attributes["solace.msg_vpn"], resource.attributes["service.instance.id"])

  # batch MUST be last. Anything that needs individual spans (filter,
  # tail_sampling) has to sit between these two.
  batch:
    send_batch_size: ${env:OTEL_BATCH_SIZE}
    timeout: ${env:OTEL_BATCH_TIMEOUT}

exporters:
  # mode: otel gives ECS/OTel field mapping; traces_index overrides where it
  # lands, one static index instead of the traces-generic.otel-default data
  # stream. Note verify.sh still searches `traces-*` and so never matches this.
  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    #traces_index: "solace_trace"
    # logs_index: "solace_traces"
    # logs_dynamic_id:
    #   enabled: true
    # traces_dynamic_id:
      # enabled: true
    mapping:
      mode: otel


  debug:
    verbosity: ${env:OTEL_DEBUG_VERBOSITY}
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  telemetry:
    logs:
      level: ${env:OTEL_LOG_LEVEL}
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check, zpages]
  pipelines:
    # Every traced VPN shares this pipeline
    traces/solace:
      receivers: [solace/vpn1, solace/vpn2]
      processors: [memory_limiter, batch]
      #processors: [memory_limiter, transform/vpn-tag, batch]
      exporters: [elasticsearch, debug]

    # Separate only to stay out of transform/vpn-tag: an instrumented app's
    # service.instance.id is not a Message VPN, and copying it would say it is.
    traces/otlp:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [elasticsearch, debug]
