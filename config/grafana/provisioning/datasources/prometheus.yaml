# Prometheus datasource — provisioned from file, HTTPS with the same
# self-signed cert as the rest of the stack (tlsSkipVerify accordingly).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-solace
    access: proxy
    url: https://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      tlsSkipVerify: true
