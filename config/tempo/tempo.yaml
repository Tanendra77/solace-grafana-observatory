# =============================================================================
# Tempo — local equivalent of TempoMonolithic with `storage.traces.backend: pv`
#
# Single process, filesystem backend on a named volume. No S3/GCS/Azure, and no
# MinIO standing in for one.
#
# Env vars are expanded because the container runs with -config.expand-env=true.
# =============================================================================

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush blocks reasonably often so traces become searchable quickly. The
  # default is much longer, which reads as "Tempo isn't ingesting" during a demo.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: ${TEMPO_RETENTION}

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# metrics_generator is deliberately left disabled, matching the OpenShift build.
# Enabling it emits RED metrics and unlocks exemplars, but needs a Prometheus to
# remote-write into — that belongs with the metrics pillar, which is out of scope.

usage_report:
  reporting_enabled: false
